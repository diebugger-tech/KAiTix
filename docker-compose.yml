services:
  db:
    image: docker.io/library/mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-kaitix}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-kaitix}
      MYSQL_USER: ${MYSQL_USER:-kaitix}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-kaitix}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-kaitix}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      # Host im Compose-Netz = Service 'db' (bewusst nicht aus ${DATABASE_URL}).
      DATABASE_URL: mysql+aiomysql://${MYSQL_USER:-kaitix}:${MYSQL_PASSWORD:-kaitix}@db:3306/${MYSQL_DATABASE:-kaitix}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "PYTHONPATH=. python scripts/db_init.py &&
             if [ \"$$SEED_DEMO_DATA\" = \"true\" ]; then PYTHONPATH=. python scripts/seed_testdata.py --if-empty; fi &&
             uvicorn app.main:app --host 0.0.0.0 --port 8003"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    environment:
      ORIGIN: http://localhost

  proxy:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

  # Seed-Service: Einmalig Demo-Daten laden
  # Aufruf: docker compose run --rm seed
  seed:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      DATABASE_URL: mysql+aiomysql://${MYSQL_USER:-kaitix}:${MYSQL_PASSWORD:-kaitix}@db:3306/${MYSQL_DATABASE:-kaitix}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./scripts:/app/scripts:ro
    command: >
      sh -c "PYTHONPATH=. python scripts/db_init.py && PYTHONPATH=. python3 scripts/seed_testdata.py"
    profiles:
      - seed

volumes:
  db_data:
