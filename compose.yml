# =============================================================================
# KAiTix — Podman Compose (Single-Image-Variante)
# =============================================================================
# Nutzt das All-in-One Containerfile (Backend + Frontend + nginx).
# Einzelner externer Port 8080.
#
# Start:  podman compose -f compose.yml up --build
# Stop:   podman compose -f compose.yml down
# =============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Containerfile
    restart: unless-stopped
    ports:
      - "8080:8003"
    environment:
      DATABASE_URL: sqlite+aiosqlite:///data/kaitix.db
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
      # Demo-Daten beim allerersten Start automatisch laden (nur wenn DB leer).
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    volumes:
      - ./data:/app/data
    # 1. Schema bootstrappen / Migrationen anwenden (robust auf leerer DB)
    # 2. Demo-Daten laden, falls aktiviert UND die DB noch leer ist (--if-empty)
    # 3. App (Backend + Frontend) starten
    command: >
      sh -c "PYTHONPATH=. /app/.venv/bin/python scripts/db_init.py &&
             if [ \"$$SEED_DEMO_DATA\" = \"true\" ]; then PYTHONPATH=. /app/.venv/bin/python scripts/seed_testdata.py --if-empty; fi &&
             /app/.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8003"
    networks:
      - kaitix
    # Auto-Rebuild beim Entwickeln:  podman compose -f compose.yml watch
    # Das All-in-One-Image hat keinen Live-Mount, daher wird bei Quelländerungen
    # das Image neu gebaut und der Container neugestartet (action: rebuild).
    develop:
      watch:
        - action: rebuild
          path: ./app
        - action: rebuild
          path: ./frontend/src
        - action: rebuild
          path: ./scripts
        - action: rebuild
          path: ./requirements.txt
        - action: rebuild
          path: ./frontend/package.json

  # Seed-Service: Einmalig Demo-Daten laden
  # Aufruf: podman compose -f compose.yml run --rm seed
  seed:
    build:
      context: .
      dockerfile: Containerfile
    environment:
      DATABASE_URL: sqlite+aiosqlite:///data/kaitix.db
    volumes:
      - ./data:/app/data
    command: >
      sh -c "PYTHONPATH=. /app/.venv/bin/python scripts/db_init.py && PYTHONPATH=. /app/.venv/bin/python scripts/seed_testdata.py"
    profiles:
      - seed
    networks:
      - kaitix



networks:
  kaitix:
