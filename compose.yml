# =============================================================================
# KAiTix — Podman Compose (Single-Image-Variante)
# =============================================================================
# Nutzt das All-in-One Containerfile (Backend + Frontend + nginx).
# Einzelner externer Port 8080.
#
# Start:  podman compose -f compose.yml up --build
# Stop:   podman compose -f compose.yml down
# =============================================================================

services:
  db:
    image: docker.io/library/mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-kaitix}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-kaitix}
      MYSQL_USER: ${MYSQL_USER:-kaitix}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-kaitix}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      # -h 127.0.0.1 erzwingt TCP (der Unix-Socket liegt in mysql:8.4 unter
      # /var/lib/mysql/, nicht /var/run/mysqld/ — 'localhost' würde fehlschlagen).
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-kaitix}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s
    networks:
      - kaitix

  app:
    build:
      context: .
      dockerfile: Containerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      # Host ist im Compose-Netz IMMER der Service 'db'. Bewusst NICHT aus
      # ${DATABASE_URL} abgeleitet, damit eine herumliegende Dev-.env
      # (z. B. @127.0.0.1 für lokale Entwicklung) den Container nicht kaputtmacht.
      DATABASE_URL: mysql+aiomysql://${MYSQL_USER:-kaitix}:${MYSQL_PASSWORD:-kaitix}@db:3306/${MYSQL_DATABASE:-kaitix}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
      # Demo-Daten beim allerersten Start automatisch laden (nur wenn DB leer).
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    depends_on:
      db:
        condition: service_healthy
    # 1. Schema bootstrappen / Migrationen anwenden (robust auf leerer DB)
    # 2. Demo-Daten laden, falls aktiviert UND die DB noch leer ist (--if-empty)
    # 3. App (Backend + Frontend + nginx) starten
    command: >
      sh -c "PYTHONPATH=. /app/.venv/bin/python scripts/db_init.py &&
             if [ \"$$SEED_DEMO_DATA\" = \"true\" ]; then PYTHONPATH=. /app/.venv/bin/python scripts/seed_testdata.py --if-empty; fi &&
             /app/start.sh"
    networks:
      - kaitix
    # Auto-Rebuild beim Entwickeln:  podman compose -f compose.yml watch
    # Das All-in-One-Image hat keinen Live-Mount, daher wird bei Quelländerungen
    # das Image neu gebaut und der Container neugestartet (action: rebuild).
    develop:
      watch:
        - action: rebuild
          path: ./app
        - action: rebuild
          path: ./frontend/src
        - action: rebuild
          path: ./scripts
        - action: rebuild
          path: ./requirements.txt
        - action: rebuild
          path: ./frontend/package.json

  # Seed-Service: Einmalig Demo-Daten laden
  # Aufruf: podman compose -f compose.yml run --rm seed
  seed:
    build:
      context: .
      dockerfile: Containerfile
    environment:
      DATABASE_URL: mysql+aiomysql://${MYSQL_USER:-kaitix}:${MYSQL_PASSWORD:-kaitix}@db:3306/${MYSQL_DATABASE:-kaitix}
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "PYTHONPATH=. /app/.venv/bin/python scripts/db_init.py && PYTHONPATH=. /app/.venv/bin/python scripts/seed_testdata.py"
    profiles:
      - seed
    networks:
      - kaitix

volumes:
  db_data:

networks:
  kaitix:
